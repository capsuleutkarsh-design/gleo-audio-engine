name: Build and release
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish GitHub releases (v<date> for Windows, v<date>-android for Android)
        type: boolean
        default: true
      platforms:
        description: Which builds to run
        type: choice
        options: [both, windows, android]
        default: both
      tag:
        description: Release tag (empty = v<date>; Android adds -android). For a second build on the same day.
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platforms != 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm ninja-build pkg-config zip python3-jinja2
          pipx install meson==1.9.2
          meson --version; cmake --version | head -1

      - name: Build
        run: |
          T="${{ inputs.tag }}"; [ -n "$T" ] || T=v$(date -u +%Y.%m.%d)
          echo "TAG=$T" >> "$GITHUB_ENV"
          TAG=$T ./build.sh

      - name: Upload the build (always kept for 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: lumen-audio-engine
          path: |
            out/*.zip
            out/*.tar
            out/SHA256SUMS.txt
            out/CONFIGURE.txt
            out/BUILDINFO.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            work/b-*/meson-logs/meson-log.txt
            work/src/ffmpeg/ffbuild/config.log
            work/b-soxr/CMakeFiles/*.log

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          # Lumen pins each release's SHA-256, so a published release is never replaced.
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::$TAG exists already"; exit 1; fi
          {
            echo "Lumen's audio engine: libmpv-2.dll (mpv + FFmpeg, audio only, Windows x64)."
            echo
            echo "**Files**"
            echo "- \`lumen-audio-engine-$TAG-win64.zip\`: the DLL, headers, LICENSES/, BUILDINFO.txt, CONFIGURE.txt"
            echo "- \`lumen-audio-engine-$TAG-source.tar\`: the corresponding source (every exact source tarball, the build scripts, licences)"
            echo "- \`SHA256SUMS.txt\`, \`CONFIGURE.txt\` (the exact configure lines), \`BUILDINFO.txt\` (versions)"
            echo
            echo '```'; cat SHA256SUMS.txt; echo '```'
            echo '```'; cat BUILDINFO.txt; echo '```'
          } > notes.md
          gh release create "$TAG" --title "Lumen audio engine $TAG" --notes-file notes.md \
            lumen-audio-engine-*.zip lumen-audio-engine-*-source.tar SHA256SUMS.txt CONFIGURE.txt BUILDINFO.txt

  android:
    if: github.event_name == 'push' || inputs.platforms != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm ninja-build pkg-config zip unzip python3-jinja2
          pipx install meson==1.9.2
          meson --version; cmake --version | head -1

      - name: Build
        run: |
          T="${{ inputs.tag }}"; [ -n "$T" ] || T=v$(date -u +%Y.%m.%d)
          echo "TAG=$T-android" >> "$GITHUB_ENV"
          TAG=$T-android ./build-android.sh

      - name: Upload the build (always kept for 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: lumen-audio-engine-android
          path: |
            out-android/*.zip
            out-android/*.tar
            out-android/SHA256SUMS.txt
            out-android/CONFIGURE.txt
            out-android/BUILDINFO.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: |
            work-android/*/b-*/meson-logs/meson-log.txt
            work-android/*/b-ffmpeg/ffbuild/config.log
            work-android/*/b-soxr/CMakeFiles/*.log

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out-android
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::$TAG exists already"; exit 1; fi
          {
            echo "Lumen's audio engine for Android: libmpv.so (mpv + FFmpeg, audio only) for arm64-v8a, armeabi-v7a and x86_64, Android 8+ (API 26)."
            echo
            echo "**Files**"
            echo "- \`lumen-audio-engine-$TAG.zip\`: \`lib/<abi>/libmpv.so\` (the APK and jniLibs layout), headers, LICENSES/, BUILDINFO.txt, CONFIGURE.txt"
            echo "- \`lumen-audio-engine-$TAG-source.tar\`: the corresponding source (every exact source tarball, the build scripts, licences)"
            echo "- \`SHA256SUMS.txt\`, \`CONFIGURE.txt\` (the exact configure lines), \`BUILDINFO.txt\` (versions)"
            echo
            echo '```'; cat SHA256SUMS.txt; echo '```'
            echo '```'; cat BUILDINFO.txt; echo '```'
          } > notes.md
          gh release create "$TAG" --title "Lumen audio engine $TAG" --notes-file notes.md \
            lumen-audio-engine-*.zip lumen-audio-engine-*-source.tar SHA256SUMS.txt CONFIGURE.txt BUILDINFO.txt
